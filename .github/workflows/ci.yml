name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, tests (Starlette + FastAPI), demo
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q -rs
      - run: make demo
        env:
          RAGQA_INDEX: numpy
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: demo-report
          path: |
            docs/images/*.png
            reports/

  faiss:
    name: FAISS index (parity with NumPy) + demo on FAISS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt faiss-cpu
      - name: Parity and IVF tests (fail instead of skip if faiss is missing)
        run: pytest -q tests/test_retrieval.py
        env:
          RAGQA_REQUIRE_FAISS: "1"
      - run: make demo
        env:
          RAGQA_INDEX: faiss
      - name: The served engine uses FAISS
        run: |
          PYTHONPATH=src python - <<'PY'
          from ragqa.service import RagEngine
          h = RagEngine().health()
          print(h)
          assert h["index_backend"] == "faiss"
          PY

  embeddings:
    name: sentence-transformers embedder
    runs-on: ubuntu-latest
    env:
      RAGQA_EMBEDDER: sentence-transformers
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt sentence-transformers
      - run: pytest -q tests/test_retrieval.py -k sentence_transformers
        env:
          RAGQA_REQUIRE_ST: "1"
      - name: Index and evaluate with MiniLM embeddings
        run: |
          python -m ragqa generate
          python -m ragqa ingest
          python -m ragqa eval --no-sweep
          python -m ragqa ask "How many paid sick days per year?"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-minilm
          path: reports/eval.json

  docker:
    name: Docker image + API smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-document-qa .
      - run: docker run -d -p 8000:8000 --name api rag-document-qa
      - name: Call the API
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/documents > /dev/null
          curl -sf -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question": "What is the forklift speed limit indoors?"}' | tee ask.json
          grep -q "8 km/h" ask.json
          curl -sf localhost:8000/openapi.json > /dev/null
